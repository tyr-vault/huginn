services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-huginn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-huginn}
      POSTGRES_DB: ${POSTGRES_DB:-huginn}
    volumes:
      - huginn-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-huginn} -d ${POSTGRES_DB:-huginn}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  scrape-engine:
    build:
      context: .
      dockerfile: Dockerfile.scrape-engine
    environment:
      SCRAPE_ENGINE_ADDR: ":8090"
      HUGINN_CONCURRENCY: ${HUGINN_CONCURRENCY:-1}
      HUGINN_DEPTH: ${HUGINN_DEPTH:-10}
      HUGINN_LANG: ${HUGINN_LANG:-en}
      HUGINN_REQUEST_PACE_MS: ${HUGINN_REQUEST_PACE_MS:-500}
      HUGINN_EXIT_IDLE: ${HUGINN_EXIT_IDLE:-2m}
      HUGINN_DEBUG: ${HUGINN_DEBUG:-false}
    expose:
      - "8090"
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      BACKEND_ADDR: ":8080"
      DATABASE_URL: ${DATABASE_URL:-postgres://huginn:huginn@postgres:5432/huginn?sslmode=disable}
      SCRAPE_ENGINE_URL: ${SCRAPE_ENGINE_URL:-http://scrape-engine:8090}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      JWT_SECRET: ${JWT_SECRET:-change-me-long-random-secret}
      HUGINN_CONCURRENCY: ${HUGINN_CONCURRENCY:-1}
      HUGINN_DEPTH: ${HUGINN_DEPTH:-10}
      HUGINN_LANG: ${HUGINN_LANG:-en}
      HUGINN_REQUEST_PACE_MS: ${HUGINN_REQUEST_PACE_MS:-500}
    depends_on:
      postgres:
        condition: service_healthy
      scrape-engine:
        condition: service_started
    expose:
      - "8080"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  huginn-pg:
